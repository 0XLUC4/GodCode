[workspace]
resolver = "3"
members = ["crates/core", "crates/lsp", "crates/app"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
godcode-core = { path = "crates/core" }
godcode-lsp = { path = "crates/lsp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Text layout is slow unoptimized; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 2
