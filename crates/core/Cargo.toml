[package]
name = "godcode-core"
description = "GodCode editing logic: syntax colours, text edits, search and fuzzy matching"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Search by regular expression and by whole word.
regex = "1"
# Reads package.json for the project X-ray.
serde_json = "1"
# Hashes of the developer toolbox (RustCrypto, pure Rust).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
