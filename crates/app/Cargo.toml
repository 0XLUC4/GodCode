[package]
name = "godcode"
description = "GodCode: pure-Rust code editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "godcode"
path = "src/main.rs"

[dependencies]
godcode-core.workspace = true
godcode-lsp.workspace = true
# The scripts of package.json, the snippets of the user.
serde_json = "1"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
egui-phosphor = { version = "0.13", features = ["fill"] }
# Deleted files go to the recycle bin instead of being lost.
trash = "5"

# The web view of the system (WebView2), for a page to show inside the window.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", features = ["devtools"] }

[build-dependencies]
winresource = "0.1"
